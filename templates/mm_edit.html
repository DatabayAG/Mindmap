<script src="#ASSETPATH#/jquery.min.js"></script>
<link type="text/css" href="#ASSETPATH#/mindmap.css" rel="stylesheet" media="screen" />
<script type="text/javascript" src="#ASSETPATH#/mindmap.js"></script>

<input type="button" value="#!mindmap_speichern!#" onclick="oldjQuery('#mindmapdata').val(oldjQuery('#map').data('mindmap').mindmap.json);oldjQuery('#mindmapform').submit();" class="submit"/>
<div id='map' style="width:500;height:400px;border: solid 1px #800000;position:relative;"></div>

<script type="text/javascript">

var oldjQuery = $;

oldjQuery(function() {
		var tree = #MINDMAPDATA#;

		var pos = $('#map').position();
		var h = $(window).height()  - pos.top-10;
		var w = $('#map').width();
		if(h<500) h = 500;
		oldjQuery('#map').css("height", h).css("width", w-20);

		oldjQuery('#map').mindmap({"tree": tree, "edit": true, "path": "#ASSETPATH#"});


});
</script>


<form id="mindmapform" method="post">
    <input type="hidden" name="sendmindmap" value="1" />
    <input type="hidden" name="mindmapdata" id="mindmapdata" />
    <input type="button" value="#!mindmap_speichern!#" onclick="oldjQuery('#mindmapdata').val(oldjQuery('#map').data('mindmap').mindmap.json);oldjQuery('#mindmapform').submit();" class="submit"/>
</form>
