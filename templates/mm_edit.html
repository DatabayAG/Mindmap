<script src="#ASSETPATH#/jquery.min.js"></script>
<link type="text/css" href="#ASSETPATH#/mindmap.css" rel="stylesheet" media="screen" />
<script type="text/javascript" src="#ASSETPATH#/mindmap.js"></script>

<form id="mindmapform" method="post" action="#FORMACTION#">
    <input type="hidden" name="mindmapdata" id="mindmapdata" />
    <div class="il-mindmap-shell il-mindmap-shell--edit">
        <div class="il-mindmap-header">
            <div>
                <div class="il-mindmap-heading">#!editmap!#</div>
                <div class="il-mindmap-hint">#!mindmap_editing_hint!#</div>
            </div>
            <button type="button" id="mindmap-save" class="btn btn-default il-mindmap-save">
                #!mindmap_speichern!#
            </button>
        </div>
        <div id="map" class="il-mindmap-canvas" aria-label="#!editmap!#"></div>
    </div>
    #REPO_SELECTOR#
</form>

<script type="text/javascript">
var oldjQuery = $;

oldjQuery(function() {
    var tree = #MINDMAPDATA#;
    var map = oldjQuery('#map');

    var resizeMap = function() {
        var top = map.offset().top;
        var height = Math.max(520, window.innerHeight - top - 32);
        map.css('height', height);
    };

    resizeMap();
    oldjQuery(window).on('resize.mindmap', resizeMap);

    map.mindmap({"tree": tree, "edit": true, "path": "#ASSETPATH#"});

    oldjQuery('#mindmap-save').on('click', function() {
        oldjQuery('#mindmapform').trigger('submit');
    });

    oldjQuery('#mindmapform').on('submit', function() {
        oldjQuery('#mindmapdata').val(map.data('mindmap').mindmap.json);
    });
});
</script>
